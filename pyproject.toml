[project]
name = "vectorless-rag"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "pydantic-ai>=2.32.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
]


[dependency-groups]
dev = ["ruff>=0.14", "pre-commit>=4"]

[project.scripts]
vectorless = "vectorless_rag.main:main"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() must run before project imports (modules read env at import time)
"src/vectorless_rag/main.py" = ["E402"]
# plus E501: question corpus strings and fixed-width report rows read worse wrapped
"eval/run_eval.py" = ["E402", "E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
