[project]
name = "vectorless-rag"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "pydantic-ai>=2.32.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
]


[project.scripts]
vectorless = "vectorless_rag.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
